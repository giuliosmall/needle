[package]
name = "needle"
version = "0.3.0"
edition = "2021"
description = "Needle - external key→page index for point queries over lake Parquet (Spotify RAP-inspired)"
license = "Apache-2.0"

[[bin]]
name = "needle"
path = "src/main.rs"

[[bin]]
name = "needled"
path = "src/needled.rs"

[dependencies]
anyhow = "1"
arrow = { version = "59", default-features = false }
arrow-array = "59"
arrow-schema = "59"
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
rayon = "1.10"
datafusion = "55"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
# Iceberg manifests (manifest-list + data manifests) are Avro; snappy/zstd match typical lake codecs.
apache-avro = { version = "0.17", features = ["snappy", "zstandard"] }

# HTTP Range + local demo server (article: ranged reads over object storage)
# Minimal HTTP client is implemented with std::net (no ureq/reqwest - rustc 1.85).
native-tls = "0.2"
tiny_http = { version = "0.12", features = ["ssl"] }
zstd = "0.13"
hmac = "0.12"
bytes = "1.12.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

